# The made-up community of the demonstration, as the seed script reads it (script-data/zene-seed.mjs).
# A word starting with $ is a local name: the script gives it an id (stable, made from the name) and
# writes the id wherever the name is used. An individual, a group or an event written with
# `account:` gets its account (and its homepage, with `homepage:`) as items of their own.
# Everyone and everything here is invented; the works and composers are real.

tag:
  # skills: what a person plays or does. A tag lies below its parents; a DAG, not a tree: the double
  # bass is a bowed and a plucked string instrument, and part of a rhythm section
  - { $: instrument, label: Instrument, kindList: [skill], icon: note, color: '#ffd166' }
  - { $: strings, label: Strings, kindList: [skill], parentList: [$instrument], icon: violin, color: '#f4a261' }
  - { $: bowed, label: Bowed strings, kindList: [skill], parentList: [$strings], icon: violin }
  - { $: violin, label: Violin, kindList: [skill], parentList: [$bowed], icon: violin }
  - { $: viola, label: Viola, kindList: [skill], parentList: [$bowed], icon: viola }
  - { $: cello, label: Cello, kindList: [skill], parentList: [$bowed], icon: cello }
  - { $: doublebass, label: Double bass, kindList: [skill], parentList: [$bowed, $plucked, $rhythm], icon: doublebass }
  - { $: plucked, label: Plucked strings, kindList: [skill], parentList: [$strings], icon: guitar }
  - { $: guitar, label: Guitar, kindList: [skill], parentList: [$plucked, $rhythm], icon: guitar }
  - { $: bassguitar, label: Bass guitar, kindList: [skill], parentList: [$plucked, $rhythm], icon: bassguitar }
  - { $: harp, label: Harp, kindList: [skill], parentList: [$plucked], icon: harp }
  - { $: keyboard, label: Keyboards, kindList: [skill], parentList: [$instrument], icon: piano, color: '#8ecae6' }
  - { $: piano, label: Piano, kindList: [skill], parentList: [$keyboard, $rhythm], icon: piano }
  - { $: synth, label: Synthesizer, kindList: [skill], parentList: [$keyboard], icon: synth }
  - { $: woodwind, label: Woodwinds, kindList: [skill], parentList: [$instrument], icon: flute, color: '#95d5b2' }
  - { $: flute, label: Flute, kindList: [skill], parentList: [$woodwind], icon: flute }
  - { $: clarinet, label: Clarinet, kindList: [skill], parentList: [$woodwind], icon: clarinet }
  - { $: oboe, label: Oboe, kindList: [skill], parentList: [$woodwind], icon: clarinet }
  - { $: sax, label: Saxophone, kindList: [skill], parentList: [$woodwind], icon: sax }
  - { $: brass, label: Brass, kindList: [skill], parentList: [$instrument], icon: trumpet, color: '#ffb703' }
  - { $: trumpet, label: Trumpet, kindList: [skill], parentList: [$brass], icon: trumpet }
