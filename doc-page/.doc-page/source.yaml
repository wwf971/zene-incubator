# The documents of the package are in doc/. The root is the package folder, as a doc page's is, so
# that .doc-page/object-frontend is named by it; comp-mdx/ of a package is never collected.
rules:
  - action: addFolder
    alias: zene
    path: ..
    collect: recursive
    exclude:
      - doc-package.yaml
      - type.yaml
      - package.json
      - .gitignore
      - .DS_Store
      - temp.md
      # the seed of the example and its source: tools, not documents
      - script-data/
      - script-build/
